# ==============================================================
# BrandPilot Enterprise Multi-Container Orchestration
# Commercial Single-Command Production Stack
# ==============================================================
version: '3.8'

services:
  # Enterprise Reverse Proxy & SSL Termination
  gateway:
    image: nginx:alpine
    container_name: brandpilot-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - brandpilot-network

  # Core FastAPI AI Governance Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brandpilot-api
    restart: always
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATA_RESIDENCY_REGION=${DATA_RESIDENCY_REGION:-us-east-1}
    ports:
      - "8000:8000"
    networks:
      - brandpilot-network

  # Next.js 16 Web Dashboard & Public Verification Portal
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: brandpilot-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - brandpilot-network

networks:
  brandpilot-network:
    driver: bridge
